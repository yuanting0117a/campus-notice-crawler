<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174b38"><title>興大校園情報站</title>
<style>
:root{color-scheme:light;--green:#174b38;--bg:#f4f7f5;--line:#dce6df;--muted:#65736b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2922;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:var(--green);color:white;padding:25px 18px 20px}header,.wrap{max-width:1000px;margin:auto}header p{opacity:.88;margin:6px 0 0}.wrap{padding:17px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab,button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.tab.active,.primary{background:var(--green);color:white;border-color:var(--green)}input,select{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;min-width:0;width:100%}.tools{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px}.meta{font-size:.84rem;color:var(--muted);margin:8px 0 14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #183b2410}.card h2{font-size:1.05rem;margin:0 0 7px;line-height:1.45}.sub{font-size:.84rem;color:var(--muted);margin-bottom:9px}.pill{display:inline-block;font-size:.77rem;padding:4px 8px;border-radius:20px;background:#edf3ef;margin:0 5px 5px 0}.good{background:#e5f4e9;color:#176333}.bad{background:#fcebea;color:#9b2828}.wait{background:#fff4d8;color:#805500}.summary{font-size:.92rem;line-height:1.65;margin:9px 0;color:#34443a}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:11px}.links a{color:#176044;text-decoration:none;font-weight:600}details{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--green);font-weight:600}details p{white-space:pre-wrap;line-height:1.65;font-size:.9rem}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.field label{display:block;font-size:.86rem;font-weight:650;margin-bottom:5px}.hint{font-size:.8rem;color:var(--muted);line-height:1.5}.profile-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.profile-head h2{font-size:1.02rem;margin:0}.route-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.route-tabs button.active{background:var(--green);color:white}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem;background:white}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#edf3ef}.hidden{display:none!important}footer{color:var(--muted);font-size:.8rem;padding:24px 0;text-align:center}@media(max-width:650px){.tools{grid-template-columns:1fr}.wrap{padding:12px}header{padding:21px 15px}.card,.panel{padding:13px}}
</style></head>
<body><header><h1 style="margin:0">興大校園情報站 <span style="font-size:.48em;font-weight:500;opacity:.82;vertical-align:middle">v1.7</span></h1><p>把對學生有用的公告、獎助學金與交通資訊集中在一起。</p></header>
<main class="wrap">
<nav><button class="tab active" data-tab="events">校園新消息</button><button class="tab" data-tab="scholarships">我的獎學金</button><button class="tab" data-tab="transit">9015／9015A 公車</button></nav>
<div class="tools"><input id="search" placeholder="搜尋公告、活動、實習、競賽…"><span id="count" class="meta"></span></div>
<div id="status" class="meta">正在讀取最新資料…</div>
<section id="profile" class="panel hidden">
<div class="profile-head"><h2>我的申請條件</h2><span class="pill">只存在這台裝置</span></div>
<p class="hint">就讀學校：國立中興大學。填一次就好；「不限科系／不限年級」的獎學金會自動納入，不確定的條件會標示待確認，不會隨便幫你排除。</p>
<div class="grid">
<div class="field"><label for="degree">就讀學制</label><select id="degree"><option value="">請選擇</option><option value="學士班">大學部</option><option value="碩士班">碩士班</option><option value="博士班">博士班</option></select></div>
<div class="field"><label for="year">目前年級</label><select id="year"><option value="">尚未選擇</option><option value="大一">大一</option><option value="大二">大二</option><option value="大三">大三</option><option value="大四">大四</option><option value="碩一">碩士一年級</option><option value="碩二">碩士二年級</option><option value="博一">博士一年級</option><option value="博二">博士二年級</option><option value="博三">博士三年級</option></select></div>
<div class="field"><label for="department">科系</label><select id="department"><option value="">請選擇</option><option>生命科學系</option><option>行銷學系</option><option>電機工程學系</option><option>資訊工程學系</option><option>機械工程學系</option><option>材料科學與工程學系</option><option>土木工程學系</option><option>環境工程學系</option><option>化學工程學系</option><option>食品暨應用生物科技學系</option><option>植物病理學系</option><option>農藝學系</option><option>園藝學系</option><option>森林學系</option><option>獸醫學系</option><option>動物科學系</option><option>生物產業機電工程學系</option><option>應用數學系</option><option>物理學系</option><option>化學系</option><option>昆蟲學系</option><option>水土保持學系</option><option>生物科技學研究所</option><option>國際農企業學士學位學程</option><option>財務金融學系</option><option>會計學系</option><option>企業管理學系</option><option>法律學系</option><option>外國語文學系</option><option>中國文學系</option><option>歷史學系</option><option>圖書資訊學研究所</option><option>其他／跨系</option></select></div>
<div class="field"><label for="nationality">國籍條件</label><select id="nationality"><option value="">不設定／不確定</option><option value="本國籍">本國籍</option><option value="外籍">外籍</option><option value="僑生">僑生</option></select></div><div class="field"><label for="economic">低收入戶／中低收入戶資格</label><select id="economic"><option value="">不設定／不確定</option><option value="no">沒有此資格</option><option value="yes">具備此資格</option></select></div>
</div>
<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px"><button class="primary" id="saveProfile">儲存我的條件</button><button id="clearProfile">清除條件</button><span id="profileSaved" class="hint"></span></div>
</section>
<section id="results"></section>
<section id="transitPanel" class="hidden"></section>
<footer>資料以學校及客運業者公開資訊為準。資格判斷僅協助初步比對，正式申請仍請核對原公告。</footer>
</main>
<script>
(function(){
var tab="events",events=[],scholarships=[],transit=null,profile={degree:"",year:"",department:"",nationality:"",economic:""};
var $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function flatten(data){return (data.sources||[]).flatMap(s=>s.records||[])}
function getProfile(){try{profile=Object.assign(profile,JSON.parse(localStorage.getItem("nchuStudentProfile")||"{}"))}catch(e){};["degree","year","department","nationality","economic"].forEach(k=>$(k).value=profile[k]||"")}
function saveProfile(){["degree","year","department","nationality","economic"].forEach(k=>profile[k]=$(k).value);localStorage.setItem("nchuStudentProfile",JSON.stringify(profile));$("profileSaved").textContent="已儲存；資格比對已更新。";render()}
function clearProfile(){profile={degree:"",year:"",department:"",nationality:""};localStorage.removeItem("nchuStudentProfile");getProfile();$("profileSaved").textContent="已清除個人條件。";render()}
function links(r){var a=[];if(r.url)a.push({title:"官方來源",url:r.url});(r.linked_pages||[]).forEach(x=>a.push({title:x.title||"詳細資訊",url:x.url}));(r.registration_links||[]).forEach(x=>a.push(x));(r.attachments||[]).forEach(x=>a.push(x));return a.filter((x,i,z)=>x.url&&z.findIndex(y=>y.url===x.url)===i)}
function scholarshipMatch(r){
 var text=[r.title,r.source_title,r.target_level,r.list_text,r.eligibility_original_text,r.eligibility_reason].join(" ");
 var conflicts=[],unknown=[];
 if(!profile.degree&&/(大學部|學士班|研究所|碩士班|博士班)/.test(text))unknown.push("請先設定學制");
 if(!profile.year&&/(大[一二三四1234]|[一二三四1234]年級|碩[一二]|博[一二三])/.test(text))unknown.push("請先設定年級");
 if(!profile.department&&/(電機工程學系|資訊工程學系|機械工程學系|材料科學與工程學系|土木工程學系|化學工程學系|物理學系|化學系|應用數學系|生命科學系|行銷學系|獸醫學系|食品暨應用生物科技學系)/.test(text))unknown.push("請先設定科系");
 if(!profile.nationality&&/(本國籍|中華民國國籍|台灣籍|僑生)/.test(text))unknown.push("請確認國籍條件");
 if(profile.degree){if(profile.degree==="學士班"&&!/(大學部|大學生|學士班|全校學生|本校學生|不限)/.test(text))unknown.push("學制未寫清楚");if(profile.degree!=="學士班"&&!new RegExp(profile.degree+"|研究生|研究所|全校學生|不限").test(text))conflicts.push("學制可能不符")}
 if(profile.year){var y=profile.year;var aliases={"大一":["大一","一年級","1年級"],"大二":["大二","二年級","2年級"],"大三":["大三","三年級","3年級"],"大四":["大四","四年級","4年級"],"碩一":["碩一","碩士班一年級","碩士班1年級"],"碩二":["碩二","碩士班二年級","碩士班2年級"],"博一":["博一","博士班一年級","博士班1年級"],"博二":["博二","博士班二年級","博士班2年級"],"博三":["博三","博士班三年級","博士班3年級"]};var yearTokens=["大一","大二","大三","大四","一年級","二年級","三年級","四年級","1年級","2年級","3年級","4年級","碩一","碩二","博一","博二","博三","碩士班1年級","碩士班2年級","博士班1年級","博士班2年級","博士班3年級"];var mentioned=yearTokens.filter(t=>text.includes(t));var allowed=(aliases[y]||[]).some(t=>text.includes(t));if(mentioned.length&&!allowed&&!/(不限年級|各年級|大學部不限)/.test(text))conflicts.push("年級限制不符");else if(!mentioned.length&&!/(不限年級|各年級|大學部不限)/.test(text)&&!(profile.degree==="學士班"&&/大學部|大學生|學士班/.test(text)))unknown.push("年級未註明")}
 if(profile.department&&profile.department!=="其他／跨系"){var known=["生命科學系","行銷學系","電機工程學系","資訊工程學系","機械工程學系","材料科學與工程學系","土木工程學系","環境工程學系","化學工程學系","食品暨應用生物科技學系","植物病理學系","農藝學系","園藝學系","森林學系","獸醫學系","動物科學系","生物產業機電工程學系","應用數學系","物理學系","化學系","昆蟲學系","水土保持學系","生物科技學研究所","國際農企業學士學位學程","財務金融學系","會計學系","企業管理學系","法律學系","外國語文學系","中國文學系","歷史學系","圖書資訊學研究所"];var mentioned=known.filter(x=>text.includes(x));if(mentioned.length&&!mentioned.includes(profile.department)&&!/(不限科系|不限系所|各院系|全校學生)/.test(text))conflicts.push("科系限制不符");else if(!mentioned.length&&!/(不限科系|不限系所|各院系|全校學生|本校學生|大學部|研究所|碩士班|博士班)/.test(text))unknown.push("科系未註明")}
 if(profile.nationality){if(/本國籍|中華民國國籍|台灣籍/.test(text)&&profile.nationality!=="本國籍")conflicts.push("國籍條件不符");if(/僑生/.test(text)&&profile.nationality!=="僑生")conflicts.push("僑生身分限定")}
 if(/低收入戶|中低收入戶/.test(text)){var mandatory=/(限低收入戶|限中低收入戶|須具(有)?低收入戶|需具(有)?低收入戶|低收入戶(及|或)中低收入戶學生)/.test(text);if(mandatory&&profile.economic==="no")conflicts.push("需要低收入戶／中低收入戶資格");else if(mandatory&&!profile.economic)unknown.push("需確認低收入戶資格");else if(!mandatory&&/(優先|加分)/.test(text))unknown.push("低收入戶可能為優先條件") }
 if(conflicts.length)return {label:"依目前條件不符合",cls:"bad",reason:conflicts.join("、")};
 if(/成績|排名|操行|家庭收入|財產|戶籍|特殊身分|原住民|身心障礙|未曾領取|不得兼領|延畢|在職專班/.test(text))unknown.push("另有成績、身分或其他條件需核對");if(unknown.length)return {label:"可能符合，建議確認",cls:"wait",reason:[...new Set(unknown)].join("；")};
 return {label:"符合已知條件",cls:"good",reason:"目前已知的學制、年級與科系條件沒有發現衝突；仍請核對成績及文件要求"};
}
function eventCard(r){var title=r.title||"未命名公告",summary=r.summary||r.full_text||"",date=(r.dates_found||[]).slice(0,3).join("、"),ls=links(r);return '<article class="card"><h2>'+esc(title)+'</h2><div class="sub">'+esc(r.source||"校園公告")+(date?" · "+esc(date):"")+'</div><p class="summary">'+esc(summary.slice(0,650))+'</p><div class="links">'+ls.map(x=>'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.title||"查看來源")+'</a>').join("")+'</div><details><summary>完整內容</summary><p>'+esc(r.full_text||r.list_text||"無可用內文")+'</p></details></article>'}
function scholarshipCard(r){var m=scholarshipMatch(r),ls=links(r),deadline=r.deadline_date||r.deadline_text||"公告未明確提供";return '<article class="card"><h2>'+esc(r.title)+'</h2><div class="sub">'+esc(r.source||"獎學金公告")+'</div><span class="pill '+m.cls+'">'+m.label+'</span><span class="pill">截止：'+esc(deadline)+'</span><p class="summary">'+esc(r.summary||r.list_text||"")+'</p><div class="hint">'+esc(m.reason)+'</div><div class="links">'+ls.map(x=>'<a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.title||"查看來源")+'</a>').join("")+'</div><details><summary>查看完整資格與申請文件</summary><p>'+esc(r.full_text||r.list_text||"")+'</p>'+(r.eligibility_paths?'<p>'+esc(r.eligibility_paths.map(x=>x.path+"："+x.reason).join("；"))+'</p>':"")+'</details></article>'}
function render(){var isScholar=tab==="scholarships";$("profile").classList.toggle("hidden",!isScholar);$("transitPanel").classList.toggle("hidden",tab!=="transit");$("results").classList.toggle("hidden",tab==="transit");var q=$("search").value.trim().toLowerCase();if(tab==="events"){var list=events.filter(r=>[r.title,r.source,r.summary,r.full_text].join(" ").toLowerCase().includes(q));$("count").textContent=list.length+" 則公告";$("results").innerHTML=list.length?list.map(eventCard).join(""):'<div class="empty">沒有找到相關公告。</div>'}else if(isScholar){var list=scholarships.filter(r=>[r.title,r.summary,r.full_text,r.list_text].join(" ").toLowerCase().includes(q));list.sort((a,b)=>{var da=a.deadline_date||"9999-99-99",db=b.deadline_date||"9999-99-99";return da.localeCompare(db)});var ok=list.filter(x=>scholarshipMatch(x).cls==="good").length,maybe=list.filter(x=>scholarshipMatch(x).cls==="wait").length;$("count").textContent=list.length+" 筆｜符合已知條件 "+ok+"｜待確認 "+maybe;$("results").innerHTML=list.length?list.map(scholarshipCard).join(""):'<div class="empty">沒有找到相關獎學金。</div>'}else{$("count").textContent="官方班表";renderTransit()}}
function renderTransit(){
 var panel=$("transitPanel");
 if(!transit){panel.innerHTML='<div class="empty">尚未取得班表資料。請直接查看<a href="https://www.taiwanbus.tw/eBUSPage/" target="_blank">官方客運時刻表</a>。</div>';return}
 var notices=(transit.notices||[]);
 var noticeHtml=notices.map(n=>'<article class="card"><h2>'+esc(n.title||"9015 路線公告")+'</h2><div class="links"><a href="'+esc(n.url)+'" target="_blank">開啟客運公告原文</a></div>'+(n.text?'<p class="hint">'+esc(n.text.slice(0,450))+'</p>':"")+(n.images||[]).map(img=>'<p><img src="'+esc(img.url)+'" alt="'+esc(img.alt||"官方時刻表")+'" style="width:100%;height:auto;border:1px solid var(--line);border-radius:10px"></p>').join("")+'</article>').join("");
 if(!transit.routes||!transit.routes.length){
   panel.innerHTML='<div class="panel"><h2>9015／9015A 官方時刻表公告</h2><p class="hint">目前官方班表以客運公告圖片提供，以下直接顯示原始時刻表，避免錯誤轉錄。藍色班次為經媽祖醫院的 9015A。</p><div class="links"><a href="'+esc(transit.source_url||"https://www.taiwanbus.tw/eBUSPage/")+'" target="_blank">公路客運官方時刻表</a><a href="https://www.tcbus.com.tw/" target="_blank">台中客運最新公告</a><a href="https://citybus.taichung.gov.tw/" target="_blank">台中公車即時動態</a></div></div>'+noticeHtml;
   if(!notices.length)panel.innerHTML+='<div class="empty">目前尚未取得客運公告圖片，請使用上方官方連結查詢。</div>';
   return;
 }
 var route=$("routeSelect")?.value||"9015",dir=$("directionSelect")?.value||"往程";
 var s=transit.routes.filter(x=>x.route===route&&x.direction===dir);
 panel.innerHTML='<div class="panel"><div class="profile-head"><h2>9015／9015A 官方時刻表</h2><span class="pill good">班表已擷取</span></div><p class="hint">班表查詢日期：'+esc(transit.query_date)+'。班次依星期及業者分流，請留意「行駛期間」。</p><div class="grid"><div class="field"><label>路線</label><select id="routeSelect"><option value="9015" '+(route==="9015"?"selected":"")+'>9015（一般路線）</option><option value="9015A" '+(route==="9015A"?"selected":"")+'>9015A（經媽祖醫院）</option></select></div><div class="field"><label>方向</label><select id="directionSelect"><option '+(dir==="往程"?"selected":"")+'>往程</option><option '+(dir==="返程"?"selected":"")+'>返程</option></select></div></div><p class="hint">'+esc(transit.notice||"")+'</p><div class="table-wrap"><table><thead><tr><th>發車時間</th><th>行駛日</th><th>客運業者</th><th>備註</th></tr></thead><tbody>'+s.flatMap(x=>x.trips||[]).map(t=>'<tr><td><b>'+esc(t.time)+'</b></td><td>'+esc(t.days)+'</td><td>'+esc(t.operator)+'</td><td>'+esc(t.notes)+'</td></tr>').join("")+'</tbody></table></div><div class="links"><a target="_blank" href="'+esc(transit.source_url)+'">公路客運官方時刻表</a><a target="_blank" href="https://www.tcbus.com.tw/">台中客運最新公告</a><a target="_blank" href="https://citybus.taichung.gov.tw/">台中公車即時動態</a></div></div>'+noticeHtml;
 $("routeSelect").addEventListener("change",renderTransit);$("directionSelect").addEventListener("change",renderTransit)
}
