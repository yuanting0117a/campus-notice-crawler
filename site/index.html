<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174b38"><title>興大校園情報站</title>
<style>
:root{color-scheme:light;--green:#174b38;--bg:#f4f7f5;--line:#dce6df;--muted:#65736b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2922;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:var(--green);color:white;padding:28px 18px 22px}header,.wrap{max-width:980px;margin:auto}header p{opacity:.85;margin:6px 0 0}.wrap{padding:18px}nav{display:flex;gap:8px;margin:0 0 14px}.tab,button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}input,select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;min-width:0}input{width:100%}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px;margin-bottom:14px}.meta{font-size:.85rem;color:var(--muted);margin:8px 0 14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #183b2410}.card h2{font-size:1.08rem;margin:0 0 8px;line-height:1.45}.sub{font-size:.85rem;color:var(--muted);margin-bottom:10px}.pill{display:inline-block;font-size:.78rem;padding:4px 8px;border-radius:20px;background:#edf3ef;margin:0 5px 5px 0}.pill.good{background:#e5f4e9;color:#176333}.pill.bad{background:#fcebea;color:#9b2828}.pill.wait{background:#fff4d8;color:#805500}.pill.category{background:#eaf0fa;color:#36517c}.summary{font-size:.92rem;line-height:1.6;margin:9px 0;color:#34443a}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.links a{color:#176044;text-decoration:none;font-weight:600}details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--green);font-weight:600}details p{white-space:pre-wrap;line-height:1.65;font-size:.92rem}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border-radius:12px}.hidden{display:none}footer{color:var(--muted);font-size:.8rem;padding:25px 0;text-align:center}@media(max-width:700px){.tools{grid-template-columns:1fr}.wrap{padding:13px}header{padding:23px 16px}}
</style></head>
<body><header><h1>興大校園情報站 <span style="font-size:.48em;font-weight:500;opacity:.82;vertical-align:middle">v1.6</span></h1><p>校園活動與獎學金公告，集中查找、保留官方來源。</p></header>
<main class="wrap"><nav><button class="tab active" data-tab="events">校園活動</button><button class="tab" data-tab="scholarships">獎學金</button></nav>
<div class="tools"><input id="search" placeholder="搜尋名稱、內容、日期或條件…"><select id="filter" class="hidden"><option value="all">全部資格</option><option value="possible">可能符合／待確認</option><option value="ineligible">標示不符合</option></select><select id="categoryFilter" class="hidden"><option value="all">全部分類</option><option>清寒／經濟弱勢</option><option>特殊身分</option><option>系所／學院限定</option><option>成績要求</option><option>企業／民間捐助</option><option>一般／其他</option></select><select id="gradeFilter" class="hidden"><option value="all">全部年級</option><option>大一</option><option>大二</option><option>大三</option><option>大四</option><option>碩士班</option><option>博士班</option><option>研究所</option><option>大學部不限年級</option><option>未註明</option></select><select id="departmentFilter" class="hidden"><option value="all">全部科系</option></select><select id="deadlineFilter" class="hidden"><option value="all">全部截止狀態</option><option value="open">尚未截止</option><option value="expired">已截止</option><option value="unknown">未提供截止日</option></select><select id="sortFilter" class="hidden"><option value="asc">截止日：近到遠</option><option value="desc">截止日：遠到近</option></select></div>
<div id="status" class="meta">正在讀取最新資料…</div><section id="results"></section><footer>資料由公開學校網站定期整理；分類為文字規則初步判斷，請以官方公告為準。</footer></main>
<script>
(function(){
var tab="events",allEvents=[],allScholarships=[],statusData=null;
var $=function(id){return document.getElementById(id)};
function flatten(data){var out=[];(data.sources||[]).forEach(function(s){(s.records||[]).forEach(function(r){out.push(r)})});return out}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function linkList(r){var links=[];if(r.url)links.push({title:"官方公告／來源",url:r.url});(r.linked_pages||[]).forEach(function(x){links.push({title:x.title||"延伸公告／詳細內容",url:x.url})});(r.registration_links||[]).forEach(function(x){links.push(x)});(r.attachments||[]).forEach(function(x){links.push(x)});return links.filter(function(x,i,a){return x.url&&a.findIndex(function(y){return y.url===x.url})===i})}
function eligibility(r){var v=String(r.eligibility_status||r.assessment||r.qualification_status||"").toLowerCase();var t=String(r.eligibility_label||r.eligibility_result||r.qualification||"");if(v.indexOf("ineligible")>=0||t.indexOf("不符合")>=0)return {cls:"bad",label:"標示不符合"};if(v||t)return {cls:"wait",label:t||"待確認"};return {cls:"wait",label:"資格待確認"}}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function card(r,isScholar){var title=r.title||r.name||"未命名公告",source=r.source||"學校公告",dates=(r.dates_found||[]).join("、"),links=linkList(r),e=isScholar?eligibility(r):null;var body=r.full_text||r.original_text||r.description||r.summary||r.list_text||"目前沒有擷取到內文。";var sum=r.summary||r.description||"";var categories=(r.categories||[]).map(function(x){return '<span class="pill category">'+esc(x)+'</span>'}).join("");var audience=r.target_level?'<span class="pill">'+esc(r.target_level)+'</span>':"";var grades=(r.eligible_grades||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join("");var departments=(r.eligible_departments||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join("");var deadline=r.deadline_date?'<span class="pill '+(r.deadline_date>=todayISO()?"good":"bad")+'">截止：'+esc(r.deadline_date.replace(/-/g,"/")+(r.deadline_time?" "+r.deadline_time:""))+'</span>':'<span class="pill wait">截止日未明</span>';var docs=Array.isArray(r.application_documents)?r.application_documents.map(function(x){return typeof x==="string"?x:(x.title||"相關文件")}).join("、"):r.application_documents;return '<article class="card"><h2>'+esc(title)+'</h2><div class="sub">'+esc(source)+(dates?" · "+esc(dates):"")+'</div>'+(e?'<span class="pill '+e.cls+'">'+esc(e.label)+'</span>':"")+audience+grades+departments+(isScholar?deadline:"")+categories+(sum?'<p class="summary">'+esc(sum)+'</p>':"")+'<div class="links">'+links.map(function(x){return '<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title||"相關連結")+'</a>'}).join("")+'</div><details><summary>查看完整公告內容與條件</summary><p>'+esc(body)+'</p>'+(r.eligibility_reason?'<p><b>資格判斷：</b>'+esc(r.eligibility_reason)+'</p>':"")+(r.eligibility_paths?'<p><b>不同申請類別：</b>'+esc(r.eligibility_paths.map(function(x){return x.path+"："+x.reason}).join("；"))+'</p>':"")+(r.eligibility_original_text?'<p><b>資格原文：</b>'+esc(r.eligibility_original_text)+'</p>':"")+(docs?'<p><b>應備文件：</b>'+esc(docs)+'</p>':"")+(r.deadline_text?'<p><b>官方截止資訊：</b>'+esc(r.deadline_text)+'</p>':"")+'</details></article>'}
function setupScholarshipFilters(){var values=[];allScholarships.forEach(function(r){(r.eligible_departments||["未註明"]).forEach(function(x){if(values.indexOf(x)<0)values.push(x)})});values.sort(function(a,b){return a.localeCompare(b,"zh-Hant")});$("departmentFilter").innerHTML='<option value="all">全部科系</option>'+values.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join("")}
function deadlineState(r){if(!r.deadline_date)return "unknown";return r.deadline_date>=todayISO()?"open":"expired"}
function gradeMatches(r,g){if(g==="all")return true;var a=r.eligible_grades||["未註明"];if(a.indexOf(g)>=0)return true;if(["大一","大二","大三","大四"].indexOf(g)>=0)return a.indexOf("大學部不限年級")>=0||a.indexOf("不限年級")>=0;if(g==="研究所")return a.indexOf("碩士班")>=0||a.indexOf("博士班")>=0;return false}
function departmentMatches(r,d){if(d==="all")return true;var a=r.eligible_departments||["未註明"];return a.indexOf(d)>=0||a.indexOf("不限系所")>=0}
function render(){var isS=tab==="scholarships";["filter","categoryFilter","gradeFilter","departmentFilter","deadlineFilter","sortFilter"].forEach(function(id){$(id).classList.toggle("hidden",!isS)});var q=$("search").value.trim().toLowerCase(),f=$("filter").value,c=$("categoryFilter").value,g=$("gradeFilter").value,d=$("departmentFilter").value,df=$("deadlineFilter").value;var list=(isS?allScholarships:allEvents).filter(function(r){var text=[r.title,r.name,r.source,r.full_text,r.summary,r.eligibility_original_text,r.eligible_grades,r.eligible_departments].join(" ").toLowerCase();if(q&&text.indexOf(q)<0)return false;if(isS&&f!=="all"){var e=eligibility(r);if(f==="ineligible"&&e.cls!=="bad")return false;if(f==="possible"&&e.cls==="bad")return false}if(isS&&c!=="all"&&(r.categories||[]).indexOf(c)<0)return false;if(isS&&!gradeMatches(r,g))return false;if(isS&&!departmentMatches(r,d))return false;if(isS&&df!=="all"&&deadlineState(r)!==df)return false;return true});if(isS){var direction=$("sortFilter").value;list.sort(function(a,b){var x=a.deadline_date||"9999-99-99",y=b.deadline_date||"9999-99-99";return direction==="asc"?x.localeCompare(y):y.localeCompare(x)})}$("results").innerHTML=list.length?list.map(function(r){return card(r,isS)}).join(""):'<div class="empty">目前沒有符合條件的資料。可以清除搜尋字詞，或稍後再查看。</div>'}
function showStatus(){var parts=[];if(statusData){(statusData.events||[]).forEach(function(x){parts.push(x.source+"："+(x.status==="ok"?"已更新":x.status==="empty"?"暫無資料":"讀取異常")+"（"+x.count+"筆）")});(statusData.scholarships||[]).forEach(function(x){parts.push(x.source+"："+x.count+"筆")});$("status").textContent="最近爬取："+(statusData.run_at||"時間未知")+"｜"+parts.join("；")}else $("status").textContent="資料載入完成；爬取狀態暫不可用。"}
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===t)});render()}
document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){setTab(b.getAttribute("data-tab"))})});$("search").addEventListener("input",render);$("filter").addEventListener("change",render);$("categoryFilter").addEventListener("change",render);$("gradeFilter").addEventListener("change",render);$("departmentFilter").addEventListener("change",render);$("deadlineFilter").addEventListener("change",render);$("sortFilter").addEventListener("change",render);
Promise.all([fetch("./data/activities.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("activities");return r.json()}),Promise.all(["./data/scholarships_1.json","./data/scholarships_2.json"].map(function(url){return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("scholarships");return r.json()})})),fetch("./data/run_status.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})]).then(function(a){allEvents=flatten(a[0]);allScholarships=a[1].reduce(function(out,part){return out.concat(flatten(part))},[]);setupScholarshipFilters();statusData=a[2];showStatus();render()}).catch(function(){ $("status").textContent="資料讀取失敗，請稍後再試。";$("results").innerHTML='<div class="empty">目前無法載入資料檔，請稍後再試。</div>'});
})();
</script></body></html>
