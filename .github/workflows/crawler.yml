name: NCHU Campus Notice Crawler and Website

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: campus-crawler-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync latest main before crawling
        run: git pull --rebase origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run crawlers
        run: python main.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update campus notices and scholarships"
            # Source files may have changed while crawling; rebase the data commit before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No data changes."
          fi
      - name: Prepare website
        run: |
          mkdir -p dist/data
          cp site/index.html dist/index.html
          cp data/activities.json data/scholarships_1.json data/scholarships_2.json data/run_status.json dist/data/
          if [ -f data/transit_9015.json ]; then cp data/transit_9015.json dist/data/; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
